RecipeFormatVersion: '2020-01-25'
ComponentName: com.station.Listener
ComponentVersion: '__VERSION__'
ComponentDescription: 'The pump listens, decides and reports what it decided'
ComponentPublisher: 'Alejandro Varela'
ComponentConfiguration:
  DefaultConfiguration:
    topic: 'station/events'
    intervalSeconds: '3'
    threshold: '__THRESHOLD__'
    accessControl:
      aws.greengrass.ipc.mqttproxy:
        com.station.Listener:mqttproxy:1:
          operations:
            - 'aws.greengrass#PublishToIoTCore'
          resources:
            - 'station/events'
Manifests:
  - Platform:
      os: linux
    Lifecycle:
      Run: >-
        python3 -u {artifacts:path}/inference.py
        --model {artifacts:path}/model.onnx
        --stats {artifacts:path}/stats.json
        --audio-root /data/station
        --mode-file /run/station/mode
        --version __VERSION__
        --topic {configuration:/topic}
        --threshold {configuration:/threshold}
        --interval {configuration:/intervalSeconds}
    Artifacts:
      - URI: 's3://__BUCKET__/station/__VERSION__/inference.py'
      - URI: 's3://__BUCKET__/station/__VERSION__/features.py'
      - URI: 's3://__BUCKET__/station/__VERSION__/model.onnx'
      - URI: 's3://__BUCKET__/station/__VERSION__/stats.json'
