# Terraform de poc-devopsdays/infra en la cuenta de AWS de la PoC.
#
#   PR que toca la infra   → plan con el rol de solo lectura; el plan queda en el resumen y en el PR
#   push a main            → solo plan: muestra qué cambiaría
#   a mano (Run workflow)  → plan, apply o destroy (destroy limpia también los core devices y el bucket)
#
# El apply nunca corre solo: lo lanzas tú. En un repo privado del plan gratis, el environment
# aws-poc limita el apply a main pero no puede pedir aprobación; ese clic es la aprobación.
#
# Entra a AWS con OIDC: el repo no guarda llaves. Los roles y el bucket del estado los crea
# poc-devopsdays/infra/github/ y las variables las deja infra/github/conectar-repo.sh.
# El plan no se sube como artefacto: lleva el estado, y el estado lleva las llaves de las bombas.
name: infra

on:
  pull_request:
    paths:
      - "poc-devopsdays/infra/**"
      - "!poc-devopsdays/infra/github/**"
      - "!poc-devopsdays/infra/**.md"
      - "poc-devopsdays/cloud/rollback_lambda.py"
      - "poc-devopsdays/cloud/dashboard.json"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "poc-devopsdays/infra/**"
      - "!poc-devopsdays/infra/github/**"
      - "!poc-devopsdays/infra/**.md"
      - "poc-devopsdays/cloud/rollback_lambda.py"
      - "poc-devopsdays/cloud/dashboard.json"
      - ".github/workflows/infra.yml"
  workflow_dispatch:
    inputs:
      accion:
        description: "Qué hacer"
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  contents: read

# Un solo estado: nunca dos corridas a la vez, y ninguna se cancela a la mitad
concurrency:
  group: infra-estado
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  DIR: poc-devopsdays/infra
  ACCION: ${{ inputs.accion || 'plan' }}
  TF_VAR_region: ${{ vars.AWS_REGION }}
  # Fallas no oídas por minuto que disparan la vuelta; se ajusta en el ensayo con la variable del repo
  TF_VAR_umbral_alarma: ${{ vars.UMBRAL_ALARMA || '8' }}

jobs:
  plan:
    # Los PR de un fork no reciben token OIDC: para ellos están las pruebas
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    outputs:
      cambios: ${{ steps.plan.outputs.cambios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false

      - name: fmt
        run: terraform -chdir="$DIR" fmt -check -recursive

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_PLAN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gh-plan-${{ github.run_id }}
          mask-aws-account-id: true

      - name: init
        run: >-
          terraform -chdir="$DIR" init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: validate
        run: terraform -chdir="$DIR" validate -no-color

      - name: plan
        id: plan
        run: |
          set +e
          extra=()
          [ "$ACCION" = destroy ] && extra=(-destroy)
          terraform -chdir="$DIR" plan -no-color -lock-timeout=5m -detailed-exitcode "${extra[@]}" > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          case $code in
            0) echo "cambios=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "cambios=true"  >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::terraform plan falló"; exit 1 ;;
          esac

      - name: resumen
        if: always() && steps.plan.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [ -f plan.txt ] || exit 0
          {
            echo "### terraform plan · \`$ACCION\`"
            echo
            grep -E '^(Plan:|No changes\.|Changes to Outputs:)' plan.txt || true
            echo
            echo '<details><summary>Plan completo</summary>'
            echo
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
            echo '</details>'
          } > resumen.md
          cat resumen.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PR" ]; then gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body-file resumen.md; fi

  apply:
    needs: plan
    if: needs.plan.outputs.cambios == 'true' && github.event_name == 'workflow_dispatch' && inputs.accion != 'plan'
    runs-on: ubuntu-24.04
    environment: aws-poc # solo main (y tu aprobación, si el plan de GitHub la permite)
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_APPLY }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gh-apply-${{ github.run_id }}
          mask-aws-account-id: true

      - name: init
        run: >-
          terraform -chdir="$DIR" init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: apply
        if: env.ACCION != 'destroy'
        run: |
          terraform -chdir="$DIR" apply -auto-approve -no-color -lock-timeout=5m
          {
            echo "### Siguiente"
            echo '```'
            terraform -chdir="$DIR" output -raw siguiente
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Greengrass registra los core devices solo; Terraform no los conoce. El bucket de artefactos
      # se vacía (todo se vuelve a publicar con demo/publish.sh): force_destroy tiene que quedar en
      # el estado antes del destroy.
      - name: destroy
        if: env.ACCION == 'destroy'
        run: |
          REGION="$TF_VAR_region" poc-devopsdays/infra/limpiar-core-devices.sh
          terraform -chdir="$DIR" apply -auto-approve -no-color -lock-timeout=5m \
            -target=aws_s3_bucket.artefactos -var forzar_borrado_bucket=true
          terraform -chdir="$DIR" destroy -auto-approve -no-color -lock-timeout=5m -var forzar_borrado_bucket=true
