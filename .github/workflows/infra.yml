# Terraform for poc-devopsdays/infra in the PoC's AWS account.
#
#   PR that touches the infra   → plan with the read-only role; the plan goes to the summary and the PR
#   push to main                → plan only: shows what would change
#   by hand (Run workflow)      → plan, apply or destroy (destroy also cleans the core devices and the bucket)
#
# Apply never runs on its own: you trigger it. On a private repo on the free plan, the aws-poc
# environment restricts apply to main but cannot ask for approval; that click is the approval.
#
# Gets into AWS with OIDC: the repo stores no keys. The roles and the state bucket are created by
# poc-devopsdays/infra/github/ and the variables are set by infra/github/connect-repo.sh.
# The plan is never uploaded as an artifact: it carries the state, and the state carries the pumps' keys.
name: infra

on:
  pull_request:
    paths:
      - "poc-devopsdays/infra/**"
      - "!poc-devopsdays/infra/github/**"
      - "!poc-devopsdays/infra/**.md"
      - "poc-devopsdays/cloud/rollback_lambda.py"
      - "poc-devopsdays/cloud/dashboard.json"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "poc-devopsdays/infra/**"
      - "!poc-devopsdays/infra/github/**"
      - "!poc-devopsdays/infra/**.md"
      - "poc-devopsdays/cloud/rollback_lambda.py"
      - "poc-devopsdays/cloud/dashboard.json"
      - ".github/workflows/infra.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  contents: read

# One state: never two runs at once, and none is cancelled halfway
concurrency:
  group: infra-state
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  DIR: poc-devopsdays/infra
  ACTION: ${{ inputs.action || 'plan' }}
  TF_VAR_region: ${{ vars.AWS_REGION }}
  # Missed faults per minute that trigger the rollback; tuned during the rehearsal with the repo variable
  TF_VAR_alarm_threshold: ${{ vars.ALARM_THRESHOLD || '8' }}

jobs:
  plan:
    # PRs from a fork get no OIDC token: the tests workflow covers them
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false

      - name: fmt
        run: terraform -chdir="$DIR" fmt -check -recursive

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_PLAN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gh-plan-${{ github.run_id }}
          mask-aws-account-id: true

      - name: init
        run: >-
          terraform -chdir="$DIR" init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: validate
        run: terraform -chdir="$DIR" validate -no-color

      - name: plan
        id: plan
        run: |
          set +e
          extra=()
          [ "$ACTION" = destroy ] && extra=(-destroy)
          terraform -chdir="$DIR" plan -no-color -lock-timeout=5m -detailed-exitcode "${extra[@]}" > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          case $code in
            0) echo "changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "changes=true"  >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::terraform plan failed"; exit 1 ;;
          esac

      - name: summary
        if: always() && steps.plan.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [ -f plan.txt ] || exit 0
          {
            echo "### terraform plan · \`$ACTION\`"
            echo
            grep -E '^(Plan:|No changes\.|Changes to Outputs:)' plan.txt || true
            echo
            echo '<details><summary>Full plan</summary>'
            echo
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
            echo '</details>'
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PR" ]; then gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body-file summary.md; fi

  apply:
    needs: plan
    if: needs.plan.outputs.changes == 'true' && github.event_name == 'workflow_dispatch' && inputs.action != 'plan'
    runs-on: ubuntu-24.04
    environment: aws-poc # main only (and your approval, if your GitHub plan allows it)
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_APPLY }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gh-apply-${{ github.run_id }}
          mask-aws-account-id: true

      - name: init
        run: >-
          terraform -chdir="$DIR" init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: apply
        if: env.ACTION != 'destroy'
        run: |
          terraform -chdir="$DIR" apply -auto-approve -no-color -lock-timeout=5m
          {
            echo "### Next steps"
            echo '```'
            terraform -chdir="$DIR" output -raw next_steps
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Greengrass registers the core devices on its own; Terraform does not know them. The artifacts
      # bucket is emptied (everything is published again with demo/publish.sh): force_destroy has to
      # be in the state before the destroy.
      - name: destroy
        if: env.ACTION == 'destroy'
        run: |
          REGION="$TF_VAR_region" poc-devopsdays/infra/clean-core-devices.sh
          terraform -chdir="$DIR" apply -auto-approve -no-color -lock-timeout=5m \
            -target=aws_s3_bucket.artifacts -var force_destroy_bucket=true
          terraform -chdir="$DIR" destroy -auto-approve -no-color -lock-timeout=5m -var force_destroy_bucket=true
